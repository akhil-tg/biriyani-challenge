<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => console.log('SW registered')).catch(e => console.log('SW fail', e));
}
</script>
<title>Biriyani Challenge — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="hero">
  <span class="mascot">🍛</span>
  <h1>Biriyani Challenge</h1>
  <p class="muted">Order Tracker</p>
</div>

<!-- login (name + 6-digit PIN) -->
<div id="loginBox" class="card narrow" hidden>
  <div class="field"><label>Your name</label><input id="lgName" autocapitalize="none" placeholder="e.g. aman"></div>
  <div class="field"><label>6-digit PIN</label><input id="lgPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" onkeydown="if(event.key==='Enter') doLogin()"></div>
  <button class="btn-block" onclick="doLogin()">LOGIN →</button>
  <p class="muted center" style="margin-top:10px">Coordinators &amp; admins log in here</p>
</div>

<!-- first-run admin setup (shown only while no admin exists) -->
<div id="setupBox" class="card narrow" hidden>
  <h2 class="center">First time setup 👋</h2>
  <p class="muted center">Create the Admin account to get started.</p>
  <div class="field"><label>Admin name</label><input id="admName" autocapitalize="none" placeholder="e.g. admin"></div>
  <div class="field"><label>6-digit PIN</label><input id="admPin" type="password" inputmode="numeric" maxlength="6" placeholder="e.g. 482915" onkeydown="if(event.key==='Enter') doSetup()"></div>
  <button class="btn-block" onclick="doSetup()">CREATE ADMIN</button>
</div>

<script src="js/common.js"></script>
<script>
async function doLogin() {
  const name = ($('#lgName').value || '').trim();
  const pin = ($('#lgPin').value || '').trim();
  if (!name || !pin) return alert('Please enter both name and PIN');
  const out = await api('login', { name, pin });
  if (!out.ok) return alert(out.error || 'Wrong name or PIN');
  saveSession(out.token, out.user);
  location.href = out.user.isAdmin ? 'admin.html' : 'order.html';
}
async function doSetup() {
  const name = ($('#admName').value || '').trim();
  const pin = ($('#admPin').value || '').trim();
  if (!name || !/^\d{6}$/.test(pin)) return alert('Name and 6-digit PIN required');
  const out = await api('setup', { name, pin });
  if (!out.ok) return alert(out.error || 'Setup failed');
  saveSession(out.token, out.user);
  location.href = 'admin.html';
}
(async () => {
  const u = getUser();
  if (u && localStorage.getItem('bc_tok')) {
    location.href = u.isAdmin ? 'admin.html' : 'order.html';
    return;
  }
  const st = await api('status');
  if (st && st.needSetup) $('#setupBox').hidden = false;
  else $('#loginBox').hidden = false;
})();
</script>
</body>
</html>
