<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(() => console.log('SW registered')).catch(e => console.log('SW fail', e));
}
</script>
<title>Biriyani Challenge — Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="hero">
  <span class="mascot">🍛</span>
  <h1>Biriyani Challenge</h1>
  <p class="muted">Order Tracker</p>
</div>

<!-- login (Supabase Authentication — email + password) -->
<div id="loginBox" class="card narrow" hidden>
  <div class="field"><label>Email</label><input id="lgEmail" type="email" autocapitalize="none" autocomplete="username" placeholder="you@example.com" onkeydown="if(event.key==='Enter') doLogin()"></div>
  <div class="field"><label>Password</label><input id="lgPass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()"></div>
  <button class="btn-block" onclick="doLogin()">LOGIN →</button>
  <p class="muted center" style="margin-top:10px">Coordinators login here · admins use <b>/admin</b></p>
</div>

<script src="/js/common.js"></script>
<script>
/* Supabase Authentication login (email + password) */
async function doLogin() {
  const email = ($('#lgEmail').value || '').trim();
  const pass = $('#lgPass').value || '';
  if (!email || !pass) return alert('Please enter both email and password');
  const out = await api('auth/login', { email, password: pass });
  if (!out.ok) return alert(out.error || 'Login failed');
  localStorage.setItem('bc_tok', out.access_token);
  if (out.refresh_token) localStorage.setItem('bc_rt', out.refresh_token);
  const me = await api('me');
  if (!me.user) {
    localStorage.removeItem('bc_tok'); localStorage.removeItem('bc_rt');
    return alert(me.error || 'Login failed');
  }
  if (me.user.isAdmin) {
    localStorage.removeItem('bc_tok'); localStorage.removeItem('bc_rt');
    return alert('Admins log in via the /admin page, not here.');
  }
  localStorage.setItem('bc_uid', me.user.id);
  localStorage.setItem('bc_user', JSON.stringify(me.user));
  location.href = '/order.html';
}
(() => {
  const u = getUser();
  if (u && localStorage.getItem('bc_tok')) {
    location.href = u.isAdmin ? '/admin.html' : '/order.html';
    return;
  }
  $('#loginBox').hidden = false;
})();
</script>
</body>
</html>
